Section "ServerLayout"
    Identifier "DahamkkeILI9488"
    Screen 0 "ILI9488Screen"
EndSection

Section "Device"
    Identifier "DahamkkeDisplay"
    Driver "modesetting"
    Option "kmsdev" "@DISPLAY_KMSDEV@"
    Option "AccelMethod" "none"
EndSection

Section "Monitor"
    Identifier "DahamkkeMonitor"
    HorizSync 10-100
    VertRefresh 50-75
EndSection

Section "Screen"
    Identifier "ILI9488Screen"
    Device "DahamkkeDisplay"
    Monitor "DahamkkeMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "@DISPLAY_MODE@"
    EndSubSection
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
